apiVersion: v2
name: bitwarden-crd-operator
description: Deploy the Bitwarden CRD Operator

type: application

version: "v0.19.1"

appVersion: "0.18.1"

keywords:
  - operator
  - bitwarden
  - vaultwarden

icon: https://lerentis.github.io/bitwarden-crd-operator/logo.png

home: https://lerentis.github.io/bitwarden-crd-operator/

sources:
  - https://github.com/Lerentis/bitwarden-crd-operator

kubeVersion: ">= 1.28.0-0"

maintainers:
  - name: lerentis
    email: lerentis+helm@uploadfilter24.eu

annotations:
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/Lerentis/bitwarden-crd-operator
  artifacthub.io/crds: |
    - kind: BitwardenSecret
      version: v1beta8
      name: bitwarden-secret
      displayName: Bitwarden Secret
      description: Management Object to create secrets from bitwarden
    - kind: RegistryCredential
      version: v1beta8
      name: registry-credential
      displayName: Regestry Credentials
      description: Management Object to create regestry secrets from bitwarden
    - kind: BitwardenTemplate
      version: v1beta8
      name: bitwarden-template
      displayName: Bitwarden Template
      description: Management Object to create secrets from a jinja template with a bitwarden lookup
  artifacthub.io/crdsExamples: |
    - apiVersion: lerentis.uploadfilter24.eu/v1beta8
      kind: BitwardenSecret
      metadata:
        name: test
      spec:
        content:
          - element:
              secretName: username
              secretRef: nameofUser
          - element:
              secretName: password
              secretRef: passwordOfUser
        id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
        name: "test-secret"
        secretType: Obaque #Optional
        namespace: "default"
        labels:
          key: value
        annotations:
          key: value
    - apiVersion: lerentis.uploadfilter24.eu/v1beta8
      kind: RegistryCredential
      metadata:
        name: test
      spec:
        usernameRef: "username"
        passwordRef: "password"
        registry: "docker.io"
        id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
        name: "test-regcred"
        namespace: "default"
        labels:
          key: value
        annotations:
          key: value
    - apiVersion: "lerentis.uploadfilter24.eu/v1beta8"
      kind: BitwardenTemplate
      metadata:
        name: test
      spec:
        name: "test-regcred"
        secretType: Obaque #Optional
        namespace: "default"
        labels:
          key: value
        annotations:
          key: value
        content:
          - element:
              filename: "config.yaml"
              template: |
                ---
                api:
                  enabled: True
                  key: {{ bitwarden_lookup("aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", "fields", "key") }}
                  allowCrossOrigin: false
                  apps:
                    "some.app.identifier:some_version":
                      pubkey: {{ bitwarden_lookup("aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", "attachment", "public_key") }}
                      enabled: true

  artifacthub.io/license: MIT
  artifacthub.io/operator: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "Updated Alpine from 3.24.2 to 3.24.4"
    - kind: changed
      description: "Updated Python from 3.14.7-r1 to 3.14.10-r1"
    - kind: changed
      description: "Updated libcrypto3 from 3.5.8-r0 to 3.5.9-r0"
    - kind: changed
      description: "Updated Bitwarden CLI from 2025.5.0 to 2026.10.1"
    - kind: changed
      description: "Updated Node.js from 24.18.1-r0 to 24.22.1-r1"
    - kind: changed
      description: "Updated kopf from 1.44.6 to 1.45.2"
    - kind: changed
      description: "Updated kubernetes from 36.0.3 to 37.0.2"
    - kind: fixed
      description: "Prevented scheduled relogin from treating existing Bitwarden sessions as authentication failures (issue #137)"
  artifacthub.io/images: |
    - name: bitwarden-crd-operator
      image: ghcr.io/lerentis/bitwarden-crd-operator:0.18.1
